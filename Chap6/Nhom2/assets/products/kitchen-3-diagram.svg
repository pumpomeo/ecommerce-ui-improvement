<path d="M70 180 H930" stroke="#d9e6df" stroke-width="2"/>
<text x="70" y="140" class="title">Bình nước 500 ml</text>

<rect x="415" y="230" width="170" height="93" rx="20" fill="#176b62"/>
<path d="M440 250 V298 M470 250 V298 M500 250 V298 M530 250 V298 M560 250 V298" stroke="#65a18c" stroke-width="4"/>
<path d="M410 320 H590 Q650 370 650 440 V732 Q650 798 588 798 H412 Q350 798 350 732 V440 Q350 370 410 320 Z" fill="#cce3d8" class="outline"/>
<path d="M395 455 V710 Q395 753 427 753" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>
<rect x="408" y="488" width="184" height="74" rx="12" fill="#fff"/>
<text x="500" y="535" text-anchor="middle" class="label">500 ml</text>
<text x="705" y="292" class="note">Nắp vặn</text>
