<rect x="607" y="469" width="160" height="44" rx="15" fill="#ea884b" class="outline"/>
<path d="M300 568 H445 L478 582 H607 M300 598 H445 L478 582" class="detail"/>
<rect x="607" y="559" width="160" height="46" rx="15" fill="#ea884b" class="outline"/>
