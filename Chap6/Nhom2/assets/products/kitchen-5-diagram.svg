<rect x="607" y="274" width="160" height="49" rx="15" fill="#ea884b" class="outline"/>
<path d="M282 375 H607 V417 H353 Q301 413 282 375 Z" fill="#e0ebe6" class="outline"/>
<rect x="607" y="373" width="160" height="47" rx="15" fill="#ea884b" class="outline"/>
